openapi: 3.0.3
info:
  title: PlanLedger API
  version: 1.0.0
  description: Brightloop Software Subscription Management & Billing Engine API
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: |-
        Production health check endpoint for monitoring uptime,
        database connectivity, and service readiness.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSuccessResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckErrorResponse'
          description: ''
  /api/v1/accounts/csrf/:
    get:
      operationId: accounts_csrf_retrieve
      description: Returns CSRF cookie and token. Useful for SPAs to initialize session
        and double-submit cookie protection.
      tags:
      - accounts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFResponse'
          description: ''
  /api/v1/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Session-based login with email and password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: Logs out the authenticated user and flushes their session.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: Retrieves the currently authenticated user's profile and tenant
        customer information.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: accounts_register_create
      description: Registers a new customer account, provisions tenant customer record,
        and returns user data.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/analytics/distribution/:
    get:
      operationId: analytics_distribution_list
      description: Active subscriber distribution by plan tier.
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDistributionItem'
          description: ''
  /api/v1/analytics/overview/:
    get:
