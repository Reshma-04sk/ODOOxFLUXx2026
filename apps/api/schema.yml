        date_joined:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - customer_id
      - date_joined
      - email
      - id
      - is_staff
      - is_superuser
    UserRegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        company_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 255
      required:
      - email
      - full_name
      - password
    ValidateDiscountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - code
      - subtotal
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
