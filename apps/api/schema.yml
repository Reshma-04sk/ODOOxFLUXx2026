  /api/v1/billing/records/:
    get:
      operationId: billing_records_list
      description: Billing execution history records (Staff only).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingExecutionRecordList'
          description: ''
  /api/v1/billing/records/{id}/:
    get:
      operationId: billing_records_retrieve
      description: Billing execution history records (Staff only).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Billing Execution Record.
        required: true
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingExecutionRecord'
          description: ''
  /api/v1/billing/trigger/:
    post:
      operationId: billing_trigger_create
      description: Manual billing execution trigger endpoint for live demos or ad-hoc
