      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerBillingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TriggerBillingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TriggerBillingRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingExecutionRecord'
          description: ''
