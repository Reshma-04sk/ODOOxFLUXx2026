services:
  - type: web
    name: planledger-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://planledger.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://planledger.vercel.app,https://*.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: BREVO_SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "notifications@brightloop.io"

  - type: cron
    name: planledger-daily-billing
    runtime: python
    rootDir: apps/api
    schedule: "0 0 * * *" # Daily at midnight UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_billing
    envVars:
      - fromService:
          type: web
          name: planledger-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: planledger-api
          envVarKey: SECRET_KEY
