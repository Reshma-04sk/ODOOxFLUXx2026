          type: string
        active_subscriptions:
          type: integer
        trialing_subscriptions:
          type: integer
        canceled_subscriptions:
          type: integer
        total_subscriptions:
          type: integer
        churn_rate:
          type: number
          format: double
        total_revenue:
          type: string
        total_outstanding:
          type: string
        arpu:
          type: string
        currency:
          type: string
      required:
      - active_subscriptions
      - arpu
      - arr
      - canceled_subscriptions
      - churn_rate
      - currency
      - mrr
      - total_outstanding
      - total_revenue
      - total_subscriptions
      - trialing_subscriptions
    Attribute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        values:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
      - values
    AttributeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    AttributeValue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attribute:
          type: integer
        name:
          type: string
          maxLength: 100
        extra_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Additional price surcharge for this variant attribute (e.g.
            Brand=Odoo +560.00)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attribute
      - created_at
      - id
      - name
      - updated_at
    AttributeValueRequest:
      type: object
      properties:
        attribute:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 100
        extra_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Additional price surcharge for this variant attribute (e.g.
            Brand=Odoo +560.00)
      required:
      - attribute
      - name
