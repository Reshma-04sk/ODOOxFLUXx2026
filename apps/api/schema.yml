  /api/v1/catalog/quotations/:
    get:
      operationId: catalog_quotations_list
      description: Quotation management, template instantiations, and subscription
        conversions.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: plan
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - canceled
          - confirmed
          - draft
          - sent
        description: |-
          * `draft` - Draft
          * `sent` - Sent
          * `confirmed` - Confirmed
          * `canceled` - Canceled
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
